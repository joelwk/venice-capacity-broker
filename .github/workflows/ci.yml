name: CI

on:
  push:
    branches: ["**"]
    tags: []
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish_guard:
    name: Block publish/release steps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan for publish/release commands
        run: |
          set -euo pipefail
          # Restrict scan to workflows and scripts
          files=$(mktemp)
          if [ -d .github/workflows ]; then \
            # Exclude this guard file to avoid self-matching the grep pattern
            find .github/workflows -type f \( -name "*.yml" -o -name "*.yaml" \) | grep -vE '/ci\.yml$' >> "$files"; \
          fi
          if [ -d scripts ]; then find scripts -type f >> "$files"; fi
          if [ ! -s "$files" ]; then echo "No candidate files to scan."; exit 0; fi
          echo "Scanning for forbidden publish commands…"
          # Add patterns that imply publishing to registries or creating releases
          # Use non-recursive grep against explicit file list to avoid scanning the whole repo
          if xargs -r grep -nE "twine +upload|npm +publish|hatch +publish|poetry +publish|python +-m +build(.*twine)?|gh +release +create|pypi" < "$files" ; then
            echo "Forbidden publish/release command detected. Remove from workflows/scripts." >&2
            exit 1
          fi
          echo "OK: no publish commands found."

  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: publish_guard
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  # This job is intentionally a no-op placeholder for deployments.
  # Deployment is handled manually via Replit Deployments as described in docs/DEPLOYMENT.md.
  # Keeping this here communicates intent and prevents accidental automation.
  deployment_instructions:
    name: Deployment (manual via Replit)
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Deployment is manual via Replit Deployments."
          echo "See docs/DEPLOYMENT.md for step-by-step instructions."
