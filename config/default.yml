app:
  name: vvv-agents
  log_level: ${LOG_LEVEL:INFO}

network:
  base:
    rpc_url: ${BASE_RPC_URL:}
    chain_id: ${BASE_CHAIN_ID:8453}

wallet:
  default_provider: eth_account  # or: smart_wallet

venice:
  base_url: ${VENICE_API_BASE_URL:https://api.venice.ai/api/v1}
  api_key: ${VENICE_API_KEY:}
  endpoints:
    create_root: ${VENICE_CREATE_ROOT_PATH:/api_keys/generate_web3_key}
    create_subkey: ${VENICE_CREATE_SUBKEY_PATH:/api_keys}
    revoke_key: ${VENICE_REVOKE_KEY_PATH:/api_keys/{key_id}}
    challenge: ${VENICE_CHALLENGE_PATH:/api_keys/generate_web3_key}
    usage: ${VENICE_USAGE_PATH:/api_keys/rate_limits/log}
    rate_limits: ${VENICE_RATE_LIMITS_PATH:/api_keys/rate_limits}
    quota: ${VENICE_QUOTA_PATH:/api_keys/rate_limits}
    models: ${VENICE_MODELS_PATH:/models}
    chat_completions: ${VENICE_CHAT_COMPLETIONS_PATH:/chat/completions}
    vvv: ${VENICE_VVV_PATH:/vvv}
    vvv_circulatingsupply: ${VENICE_VVV_CIRC_PATH:/vvv/circulatingsupply}
    vvv_utilization: ${VENICE_VVV_UTIL_PATH:/vvv/utilization}
    vvv_staking_yield: ${VENICE_VVV_YIELD_PATH:/vvv/staking_yield}Why

contracts:
  vvv_token: ${VVV_TOKEN_ADDRESS:}
  vvv_staking: ${VVV_STAKING_ADDRESS:}
  diem_token: ${DIEM_TOKEN_ADDRESS:}
  diem_market: ${DIEM_MARKET_ADDRESS:}

dex:
  providers: ${DEX_PROVIDERS:uniswap_v2,aerodrome}
  uniswap_v2_router: ${UNISWAP_V2_ROUTER_ADDRESS:}
  aerodrome_router: ${AERODROME_ROUTER_ADDRESS:}
  aerodrome_stable: ${AERODROME_STABLE:true}
  router: ${ROUTER_ADDRESS:}  # legacy fallback for Uniswap V2
  quote_token: ${QUOTE_TOKEN_ADDRESS:}
  slippage_bps: ${SLIPPAGE_BPS:100}

broker_api:
  host: ${BROKER_API_HOST:127.0.0.1}
  port: ${BROKER_API_PORT:8000}

marketdata:
  sanity_threshold: ${MARKETDATA_SANITY_THRESHOLD:0.15}
  watcher_interval_seconds: ${MARKETDATA_WATCHER_INTERVAL:180}

orchestrator:
  progressive_enable: ${STAKEMASTER_PROGRESSIVE_ENABLE:true}
  progressive_cycles: ${STAKEMASTER_PROGRESSIVE_CYCLES:5}
  price_guard_streak_max: ${ARBI_PRICE_GUARD_STREAK_MAX:15}
  price_guard_min_streak: ${ARBI_PRICE_GUARD_MIN_STREAK:5}
  price_guard_max_drift: ${ARBI_PRICE_GUARD_MAX_DRIFT:0.2}
  price_guard_max_vol_bps: ${ARBI_PRICE_GUARD_MAX_VOL_BPS:25.0}
