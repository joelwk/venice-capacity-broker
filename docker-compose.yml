services:
  postgres:
    image: postgres:15
    container_name: vvv-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: vvv-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  broker:
    build:
      context: .
      dockerfile: Dockerfile
    image: venice-broker:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
      - .env.docker
      - docker/.env.local
    environment:
      BROKER_REQUIRE_ADMIN_TOKEN: "true"
      BROKER_ADMIN_TOKEN: ${BROKER_ADMIN_TOKEN:?set}
      VENICE_API_BASE_URL: ${VENICE_API_BASE_URL:-https://api.venice.ai/api/v1}
      VENICE_PARENT_KEY: ${VENICE_PARENT_KEY:-}
      SQL_DATABASE_URL: ${SQL_DATABASE_URL:-postgresql+psycopg2://postgres:postgres@postgres:5432/postgres}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ENABLED: ${CORS_ENABLED:-false}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      # Enable quotes and use market pricing engine
      QUOTES_ENABLED: ${QUOTES_ENABLED:-1}
      PRICE_ENGINE: ${PRICE_ENGINE:-market}
      # Limit accepted assets to those with known liquidity/config in this deployment
      ACCEPT_ASSETS: ${ACCEPT_ASSETS:-ETH,USDC}
      # Speed up quote aggregation safely
      DEX_FIRST_QUOTE_LINGER_MS: ${DEX_FIRST_QUOTE_LINGER_MS:-60}
      DEX_AGGREGATE_TIMEOUT_SECONDS: ${DEX_AGGREGATE_TIMEOUT_SECONDS:-1.2}
      DEX_PROVIDER_TIMEOUT_SECONDS: ${DEX_PROVIDER_TIMEOUT_SECONDS:-0.9}
      DEX_MAX_WORKERS: ${DEX_MAX_WORKERS:-4}
      # RPC client timeout to avoid long stalls
      RPC_REQUEST_TIMEOUT_SECONDS: ${RPC_REQUEST_TIMEOUT_SECONDS:-5}
      # Etherscan path verifier tuning
      ETHERSCAN_TIMEOUT_SECONDS: ${ETHERSCAN_TIMEOUT_SECONDS:-8}
      ETHERSCAN_MAX_RETRIES: ${ETHERSCAN_MAX_RETRIES:-1}
      # Bridge fallback pool addresses (ensure these point to live pools)
      DIEM_VVV_PAIR_ADDRESS: ${DIEM_VVV_PAIR_ADDRESS:-}
      VVV_USDC_POOL_ADDRESS: ${VVV_USDC_POOL_ADDRESS:-}
      # MarketData init behavior (avoid blocking)
      MARKETDATA_INIT_LIGHT: ${MARKETDATA_INIT_LIGHT:-true}
      MARKETDATA_SKIP_TRADE_PATH_VALIDATION: ${MARKETDATA_SKIP_TRADE_PATH_VALIDATION:-}
      # Make startup tests non-blocking in Docker
      BROKER_TESTS_BACKGROUND: ${BROKER_TESTS_BACKGROUND:-1}
      BROKER_SKIP_TESTS: ${BROKER_SKIP_TESTS:-0}
    ports:
      - "8000:8000"
    volumes:
      - ./.env:/app/.env:ro
      - ./.env.docker:/app/.env.docker:ro
      - ./docker/.env.local:/app/docker/.env.local:ro
      - ./logs:/app/logs

  orchestrator:
    image: venice-broker:latest
    depends_on:
      broker:
        condition: service_started
    env_file:
      - .env
      - .env.docker
      - docker/.env.local
    environment:
      AUTOSTART_BROKER_API: "0"
      AUTOSTART_ORCHESTRATOR: "1"
      AUTOSTART_ORCHESTRATOR_LIVE: ${AUTOSTART_ORCHESTRATOR_LIVE:-0}
      SQL_DATABASE_URL: ${SQL_DATABASE_URL:-postgresql+psycopg2://postgres:postgres@postgres:5432/postgres}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Portfolio inventory: Set RISK_ENABLE_PORTFOLIO_CAP=1 to enable
      # Falls back to DIEM_INVENTORY_UNITS, VVV_INVENTORY_UNITS, USDC_INVENTORY_UNITS if wallet unavailable
      RISK_ENABLE_PORTFOLIO_CAP: ${RISK_ENABLE_PORTFOLIO_CAP:-0}
    command: >
      sh -c "
      if [ \"${AUTOSTART_ORCHESTRATOR_LIVE:-0}\" = \"1\" ]; then
        python apps/cli/main.py run:loop --sleep 15 --max-cycles 0 --enable-live
      else
        python apps/cli/main.py run:loop --sleep 15 --max-cycles 0
      fi
      "
    volumes:
      - ./.env:/app/.env:ro
      - ./.env.docker:/app/.env.docker:ro
      - ./docker/.env.local:/app/docker/.env.local:ro
      - ./logs:/app/logs

  token-watcher:
    image: venice-broker:latest
    depends_on:
      broker:
        condition: service_started
    env_file:
      - .env
      - .env.docker
      - docker/.env.local
    environment:
      SQL_DATABASE_URL: ${SQL_DATABASE_URL:-postgresql+psycopg2://postgres:postgres@postgres:5432/postgres}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AUTOSTART_TOKEN_WATCHER_ALLOW_NO_KEY: ${AUTOSTART_TOKEN_WATCHER_ALLOW_NO_KEY:-0}
    command: python services/marketdata/token_watcher.py
    volumes:
      - ./.env:/app/.env:ro
      - ./.env.docker:/app/.env.docker:ro
      - ./docker/.env.local:/app/docker/.env.local:ro
      - ./logs:/app/logs

  tests:
    image: venice-broker:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
      - .env.docker
      - docker/.env.local
    working_dir: /app
    command: sh -c "rm -f *.db test-*.db tmp*.db && pytest -q"
    profiles: [tests]
    volumes:
      - ./.env:/app/.env:ro
      - ./.env.docker:/app/.env.docker:ro
      - ./docker/.env.local:/app/docker/.env.local:ro
      - ./logs:/app/logs

volumes:
  pgdata:
