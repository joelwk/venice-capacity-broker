services:
  postgres:
    image: postgres:15
    container_name: vvv-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: vvv-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  broker:
    build:
      context: .
      dockerfile: Dockerfile
    image: venice-broker:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
      - .env.docker
    environment:
      BROKER_REQUIRE_ADMIN_TOKEN: "true"
      BROKER_ADMIN_TOKEN: ${BROKER_ADMIN_TOKEN:?set}
      VENICE_API_BASE_URL: ${VENICE_API_BASE_URL:-https://api.venice.ai/api/v1}
      VENICE_PARENT_KEY: ${VENICE_PARENT_KEY:-}
      SQL_DATABASE_URL: ${SQL_DATABASE_URL:-postgresql+psycopg2://postgres:postgres@postgres:5432/postgres}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ENABLED: ${CORS_ENABLED:-false}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
    ports:
      - "8000:8000"
    volumes:
      - ./.env:/app/.env:ro
      - ./.env.docker:/app/.env.docker:ro
      - ./logs:/app/logs

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    image: venice-broker:latest
    depends_on:
      broker:
        condition: service_started
    env_file:
      - .env
      - .env.docker
    environment:
      AUTOSTART_BROKER_API: "0"
      AUTOSTART_ORCHESTRATOR: "1"
      AUTOSTART_ORCHESTRATOR_LIVE: ${AUTOSTART_ORCHESTRATOR_LIVE:-0}
      SQL_DATABASE_URL: ${SQL_DATABASE_URL:-postgresql+psycopg2://postgres:postgres@postgres:5432/postgres}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: bash -lc "python apps/cli/main.py run:loop --sleep 15 --max-cycles 0 ${AUTOSTART_ORCHESTRATOR_LIVE:+--enable-live}"
    profiles: [helpers]
    volumes:
      - ./.env:/app/.env:ro
      - ./.env.docker:/app/.env.docker:ro
      - ./logs:/app/logs

  token-watcher:
    build:
      context: .
      dockerfile: Dockerfile
    image: venice-broker:latest
    depends_on:
      broker:
        condition: service_started
    env_file:
      - .env
      - .env.docker
    environment:
      SQL_DATABASE_URL: ${SQL_DATABASE_URL:-postgresql+psycopg2://postgres:postgres@postgres:5432/postgres}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AUTOSTART_TOKEN_WATCHER_ALLOW_NO_KEY: ${AUTOSTART_TOKEN_WATCHER_ALLOW_NO_KEY:-0}
    command: bash -lc "python services/marketdata/token_watcher.py"
    profiles: [helpers]
    volumes:
      - ./.env:/app/.env:ro
      - ./.env.docker:/app/.env.docker:ro
      - ./logs:/app/logs

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    image: venice-broker:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
      - .env.docker
    working_dir: /app
    command: bash -lc "pytest -q"
    profiles: [tests]
    volumes:
      - ./.env:/app/.env:ro
      - ./.env.docker:/app/.env.docker:ro
      - ./logs:/app/logs

volumes:
  pgdata:
