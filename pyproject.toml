[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "venice-capacity-broker"
version = "0.1.0"
description = "Quorum-driven capacity broker and agent orchestration for Venice (VVV/DIEM) on Base using LangGraph and Coinbase AgentKit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Environment :: Web Environment",
]

# Base runtime deps kept minimal; feature sets are extras below.
dependencies = [
  "requests>=2.31",
  "pydantic>=2.6",
  "fastapi",
  "uvicorn",
  "alembic>=1.12",
  # Load environment variables from .env when present
  "python-dotenv>=1.0",
  "web3>=6.15",
  "eth-account>=0.10",
  "pycryptodome>=3.18",
]

[project.urls]
Homepage = "https://venice-capacity-broker.replit.app/buy.html"
Documentation = "https://github.com/joelwk/venice-capacity-broker"

[project.optional-dependencies]
broker = [
  "sqlmodel>=0.0.14",
  "psycopg2-binary>=2.9",
  "redis>=5.0",
  "langsmith>=0.1.38",
  "alembic>=1.12",
]
db = ["sqlmodel>=0.0.14", "psycopg2-binary>=2.9"]
kv = ["redis>=5.0"]
tracing = ["langsmith>=0.1.38"]
graph = ["langchain", "langgraph"]
web3 = ["web3>=6.15", "eth-account>=0.10"]
agentkit = ["coinbase-agentkit>=0.3", "cdp-sdk>=0.10"]
dev = ["pytest", "pytest-asyncio", "pytest-timeout", "httpx", "alembic>=1.12", "playwright>=1.44", "ruff>=0.5.0"]

[tool.uv]
# uv configuration (no editable flag needed; uv installs project in editable mode for the workspace root).

[tool.hatch.build]
# Defensive: exclude non-runtime assets from built artifacts (sdist/wheel)
exclude = [
  "**/.env",
  "**/*.env",
  "**/*.key",
  "**/*.pem",
  "**/*.crt",
  "**/*.pfx",
  "**/.DS_Store",
  "**/.pytest_cache/**",
  "**/__pycache__/**",
  "infra/**",
  "tests/**",
  "scripts/**",
  "docker-compose.yml",
  ".replit",
  "replit.nix",
]

[tool.hatch.build.targets.sdist]
packages = ["apps", "libs", "services", "agents", "graph", "db"]
exclude = ["@tool.hatch.build.exclude"]

[tool.hatch.build.targets.wheel]
packages = ["apps", "libs", "services", "agents", "graph", "db"]
exclude = ["@tool.hatch.build.exclude"]

[tool.ruff]
exclude = [
    "services/marketdata/provider.py",  # Corrupted binary file
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "EM", "ISC", "ICN", "G", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SIM", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "RUF"]
